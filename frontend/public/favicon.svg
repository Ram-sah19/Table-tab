<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1611"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield with Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Dining Cloche Base Plate -->
  <path d="M120 376 H392 C400 376 408 384 408 392 C408 400 400 408 392 408 H120 C112 408 104 400 104 392 C104 384 112 376 120 376 Z" fill="url(#goldGrad)"/>

  <!-- Dining Cloche Dome Arc -->
  <path d="M136 360 C136 270 200 208 256 208 C312 208 376 270 376 360" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

  <!-- Central Stylized Saffron Flame / Ember -->
  <path d="M256 104 C256 104 296 176 296 232 C296 264 278 288 256 296 C234 288 216 264 216 232 C216 176 256 104 256 104 Z" fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Inner Spark Flame -->
  <path d="M256 176 C256 176 276 216 276 244 C276 260 266 272 256 276 C246 272 236 260 236 244 C236 216 256 176 256 176 Z" fill="#fffbeb"/>

  <!-- Sparkle Accents -->
  <path d="M370 160 L378 178 L396 186 L378 194 L370 212 L362 194 L344 186 L362 178 Z" fill="url(#goldGrad)"/>
  <circle cx="140" cy="180" r="8" fill="#f59e0b"/>
</svg>
